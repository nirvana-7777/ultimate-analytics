apiVersion: 1
datasources:
  - name: Postgres
    uid: postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: analytics
    isDefault: true
    secureJsonData:
      password: ${ANALYTICS_PG_PASSWORD}
    jsonData:
      database: analytics
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
      maxOpenConns: 20
