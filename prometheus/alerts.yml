groups:
  - name: analytics
    rules:
      # Every rule below reads series exported by these two jobs. If one dies, those
      # series go absent and the rules stay silent instead of firing, so this is the
      # only rule that catches a dead ingester/worker.
      - alert: AnalyticsTargetDown
        expr: up{job=~"ingester|worker"} == 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.job }} ({{ $labels.instance }}) is not being scraped"

      # Ingest gap (doc §7): the only outage signal — the backend sends no
      # drop counters. Fires when a sender that was active in the last hour
      # has produced nothing for >10 min.
      - alert: AnalyticsIngestGap
        expr: >
          (time() - max by (sender) (analytics_last_event_ts) > 600)
          and on(sender)
          (sum by (sender) (increase(analytics_events_received_total[1h])) > 0)
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "No events from sender={{ $labels.sender }} for >10m after traffic in the last hour"

      # A backend regression or schema mismatch shows up here first.
      - alert: AnalyticsQuarantineSpike
        expr: sum by (reason) (increase(analytics_events_quarantined_total[10m])) > 20
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: "Quarantine spike: reason={{ $labels.reason }}"

      # Steady clock skew (round-2 C): the histogram catches what
      # analytics_events_late_total (regression detector) cannot.
      - alert: AnalyticsIngestSkew
        expr: >
          histogram_quantile(0.99,
            sum by (sender, le) (rate(analytics_ingest_lag_seconds_bucket[10m]))) > 600
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "sender={{ $labels.sender }}: p99 ingest lag >10min — check backend clocks"

      - alert: AnalyticsWorkerStuck
        expr: analytics_worker_lag_seconds > 300
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "Worker has not completed a tick for >5min"

      - alert: AnalyticsRollupDroppedLate
        expr: increase(analytics_rollup_dropped_late_total[10m]) > 0
        for: 0m
        labels: { severity: ticket }
        annotations:
          summary: "Rollup dropped late/over-cap buckets — check skew vs ANALYTICS_MAX_EVENTS_AGE_S"

      # Round-3: rows in the DEFAULT partition mean partition maintenance
      # failed (worker down / ensure_ahead erroring) — ingest still works,
      # but the worker must be fixed before the safety net fills up.
      - alert: AnalyticsRowsInDefaultPartition
        expr: analytics_events_in_default > 0
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: "events_default holds {{ $value }} rows — worker partition maintenance is behind"

      # Round-3: the per-event fallback should be ~0 after the sanitizer; any
      # sustained rate means an unknown poison class is reaching the DB.
      - alert: AnalyticsIngestBatchFallback
        expr: increase(analytics_ingest_batch_fallback_total[10m]) > 2
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: "Per-event insert fallback fired — an unknown poison is passing validation"

      # Round-4: the outage catch-up clamp abandoned received_at backlog older
      # than ANALYTICS_MAX_EVENTS_AGE_S. A jump means the worker was down (or
      # failing) long enough that data outside the clamp was never processed —
      # check what else happened while it was down.
      - alert: AnalyticsBacklogAbandoned
        expr: increase(analytics_worker_backlog_abandoned_seconds_total[1h]) > 0
        for: 0m
        labels: { severity: ticket }
        annotations:
          summary: "Worker clamped its discovery window — {{ $value }}s of received_at backlog abandoned (outage recovery)"
