global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

# TODO: alerts.yml labels rules severity page/ticket but nothing routes them yet.
# Point this at your Alertmanager (or use Grafana-managed alerting) and enable it:
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  # Internal listener: /healthz /readyz /metrics are auth-exempt by design
  # (Docker-network only; Caddy only exposes the public listener).
  - job_name: ingester
    static_configs:
      - targets: ["ingester:9000"]
  - job_name: worker
    static_configs:
      - targets: ["worker:9100"]
